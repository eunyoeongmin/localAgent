name: CI and Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

      # すべてのテストがパスした場合のみデプロイを進行
      - name: Push to Hugging Face
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://eym123:$HF_TOKEN@huggingface.co/spaces/eym123/LOCAL_LLM_TEST2 main
